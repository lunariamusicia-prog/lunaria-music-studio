<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#3C0A0C"><title>Acceso | LUNARIA AI MUSIC STUDIO</title>
<style>
:root{--wine:#3C0A0C;--cream:#F2F1ED;--gold:#B38F6F;--ink:#161616;--muted:#776d68}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#672326 0%,var(--wine) 48%,#160809 100%);color:var(--cream);font-family:Georgia,'Times New Roman',serif;display:grid;place-items:center;padding:24px}.card{width:min(100%,480px);border:1px solid #b38f6f66;background:#161616ed;border-radius:22px;padding:34px;box-shadow:0 24px 80px #0008}.brand{text-align:center;color:var(--gold);letter-spacing:.22em;font-size:14px}.brand strong{display:block;font-size:32px;letter-spacing:.16em;margin:8px 0 4px;color:var(--cream)}.brand span{font:11px Arial,sans-serif;letter-spacing:.3em}.rule{height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:26px 0}h1{text-align:center;font-size:25px;font-weight:400;margin:0 0 8px}p.sub{text-align:center;color:#c8bdb5;font:14px/1.5 Arial,sans-serif;margin:0 0 26px}label{display:block;font:12px Arial,sans-serif;color:#d7c8bc;margin:16px 0 7px}input{width:100%;border:1px solid #796354;background:#f2f1ed;color:#161616;border-radius:10px;padding:14px;font:15px Arial,sans-serif;outline:none}input:focus{border-color:var(--gold);box-shadow:0 0 0 3px #b38f6f33}button{width:100%;border:0;border-radius:10px;padding:14px;margin-top:18px;background:var(--gold);color:#1b1110;font-weight:700;font-size:14px;cursor:pointer}button.secondary{margin-top:10px;background:transparent;color:var(--cream);border:1px solid #b38f6f}button:disabled{opacity:.55;cursor:wait}.message{display:none;margin-top:18px;padding:12px;border-radius:9px;background:#ffffff10;color:#f3e6d8;font:13px/1.5 Arial,sans-serif;white-space:pre-wrap}.back{display:block;text-align:center;color:#d8bda6;margin-top:24px;font:13px Arial,sans-serif;text-decoration:none}.foot{text-align:center;color:#9d8a80;font:11px Arial,sans-serif;margin-top:22px}@media(max-width:420px){.card{padding:25px 20px}}
</style>
</head>
<body>
<main class="card">
  <div class="brand">☾ <strong>LUNARIA</strong><span>AI MUSIC STUDIO</span></div>
  <div class="rule"></div>
  <h1>Acceso privado</h1>
  <p class="sub">Ingresa a tu espacio de trabajo o consulta tu pedido mediante un enlace seguro.</p>
  <form id="loginForm">
    <label for="email">Correo electrónico</label><input id="email" type="email" autocomplete="username" required placeholder="correo@ejemplo.com">
    <label for="password">Contraseña</label><input id="password" type="password" autocomplete="current-password" required placeholder="Tu contraseña">
    <button id="loginBtn" type="submit">Iniciar sesión</button>
  </form>
  <button class="secondary" id="magicBtn" type="button">Recibir enlace mágico por correo</button>
  <div id="message" class="message" role="status" aria-live="polite"></div>
  <a class="back" href="index.html">← Volver a LUNARIA</a>
  <div class="foot">Acceso protegido · LUNARIA AI MUSIC STUDIO</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(() => {
  const URL = 'https://jqbwtulwjqsnfswtmzkg.supabase.co';
  const KEY = 'sb_publishable_u8w-v7y-djJkPOtw_YTYRw_LM9NpcqW';
  const sb = window.supabase.createClient(URL, KEY, {auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  const $ = id => document.getElementById(id);
  const msg = (text, bad=false) => { $('message').style.display='block'; $('message').textContent=text; $('message').style.border=bad?'1px solid #c56b6b':'1px solid #b38f6f66'; };
  const busy = value => { $('loginBtn').disabled=value; $('magicBtn').disabled=value; };
  const roleNames = {admin:'Administrador',production:'Producción musical',support:'Atención al cliente',customer:'Cliente'};
  async function verifyProfile(user) {
    const {data,error} = await sb.from('profiles').select('display_name,role,active').eq('id',user.id).single();
    if(error || !data || !data.active) { await sb.auth.signOut(); throw new Error('Tu cuenta no tiene un perfil activo en LUNARIA. Contacta al administrador.'); }
    if (data.role === 'admin') {
      msg('Acceso administrativo validado. Abriendo panel…');
      window.location.replace('panel.html');
      return;
    }
    msg('Sesión iniciada correctamente.\nPerfil: '+(data.display_name || user.email)+'\nRol: '+(roleNames[data.role] || data.role)+'.\n\nTu acceso está validado. El espacio correspondiente a tu rol aún no está habilitado.');
  }
  $('loginForm').addEventListener('submit', async e => {
    e.preventDefault(); busy(true); msg('Verificando acceso…');
    try {
      const {data,error} = await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});
      if(error) throw error;
      await verifyProfile(data.user);
    } catch(err) { msg(err.message || 'No fue posible iniciar sesión.',true); }
    finally { busy(false); }
  });
  $('magicBtn').addEventListener('click', async () => {
    const email=$('email').value.trim();
    if(!email || !$('email').checkValidity()){ msg('Escribe primero un correo electrónico válido.',true); $('email').focus(); return; }
    busy(true); msg('Solicitando enlace seguro…');
    try {
      const {error}=await sb.auth.signInWithOtp({email,options:{shouldCreateUser:false,emailRedirectTo:window.location.href.split('?')[0]}});
      if(error) throw error;
      msg('Si el correo corresponde a una cuenta habilitada, recibirás un enlace de acceso. Revisa tu bandeja de entrada y spam.');
    } catch(err) { msg(err.message || 'No fue posible enviar el enlace.',true); }
    finally { busy(false); }
  });
  // El formulario siempre se muestra. Solo se redirige tras pulsar «Iniciar sesión».
})();
</script>
</body></html>
